<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebecca Desktop Companion</title>
    <link rel="stylesheet" href="rebecca.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        #companion {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 25px;
            -webkit-app-region: no-drag;
        }

        #character {
            width: 280px;
            height: auto;
            max-height: 360px;
            object-fit: contain;


            transform-origin: center bottom;
            animation: rebeccaIdle 3s ease-in-out infinite;

            user-select: none;
            -webkit-user-drag: none;
            pointer-events: auto;
            -webkit-app-region: no-drag;
        }

        @keyframes rebeccaIdle {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            25% {
                transform: translateY(-3px) rotate(-0.4deg);
            }

            50% {
                transform: translateY(-7px) rotate(0deg);
            }

            75% {
                transform: translateY(-3px) rotate(0.4deg);
            }
        }

        @keyframes rebeccaReact {
            0%   { transform: scale(1) rotate(0deg); }
            30%  { transform: scale(1.12) rotate(-5deg); }
            60%  { transform: scale(0.95) rotate(4deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        #character.reacting {
            animation: rebeccaReact 0.4s ease-in-out;
        }
    </style>
</head>

<body>
    <div id="companion">
        <img id="character" src="rebecca.png" alt="Rebecca">
    </div>





<script>
    const character = document.getElementById("character");

    function blink() {
        character.src = "rebecca_closed.png";

        setTimeout(() => {
            character.src = "rebecca.png";
        }, 120);
    }

    function scheduleBlink() {
        const nextBlink = Math.random() * 3000 + 2000;

        setTimeout(() => {
            blink();
            scheduleBlink();
        }, nextBlink);
    }

    scheduleBlink();




let isDragging = false;
let startX = 0;
let startY = 0;
let lastX = 0;
let lastY = 0;
let suppressClick = false;

character.style.cursor = 'default';

character.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;

    isDragging = false;
    suppressClick = false;

    startX = event.screenX;
    startY = event.screenY;

    lastX = event.screenX;
    lastY = event.screenY;

    character.setPointerCapture(event.pointerId);
});

character.addEventListener('pointermove', (event) => {
    if (!character.hasPointerCapture(event.pointerId)) return;
    if (!(event.buttons & 1)) return;

    const totalX = event.screenX - startX;
    const totalY = event.screenY - startY;

    if (Math.abs(totalX) > 4 || Math.abs(totalY) > 4) {
        isDragging = true;
    }

    if (isDragging) {
        const deltaX = event.screenX - lastX;
        const deltaY = event.screenY - lastY;

        window.desktopCompanion.moveWindowBy(deltaX, deltaY);

        lastX = event.screenX;
        lastY = event.screenY;
    }
});

character.addEventListener('pointerup', (event) => {
    if (character.hasPointerCapture(event.pointerId)) {
        character.releasePointerCapture(event.pointerId);
    }

    if (isDragging) {
        suppressClick = true;

        setTimeout(() => {
            suppressClick = false;
        }, 200);
    }

    isDragging = false;
});

character.addEventListener('click', () => {
    if (suppressClick) return;

    character.classList.remove('reacting');

    // Restart the reaction animation.
    void character.offsetWidth;

    character.classList.add('reacting');

    setTimeout(() => {
        character.classList.remove('reacting');
    }, 400);
});
</script>    
</body>
</html>
